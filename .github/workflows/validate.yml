name: Validate CharacterWord
on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check vendor/jszip.min.js
      - name: Validate the page and asset catalog
        run: node scripts/validate-project.mjs
