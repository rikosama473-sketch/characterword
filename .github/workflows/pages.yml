name: Deploy CharacterWord to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble static editor
        run: |
          rm -rf _site
          mkdir -p _site/data _site/docs _site/vendor
          cp index.html styles.css app.js _site/
          cp vendor/jszip.min.js _site/vendor/
          cp data/asset-sources.json _site/data/
          cp docs/ASSET_RESEARCH.md docs/ANIME_PACK_INTEGRATION.md _site/docs/

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
